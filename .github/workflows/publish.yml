name: Publish Package to npmjs
# npm Trusted Publishing (OIDC) — NO registry-url on setup-node: it writes an .npmrc with an
# empty _authToken, npm then thinks it is authenticated and the OIDC exchange is denied (403): no NPM_TOKEN, nothing to expire. Publish = push a `v<version>` tag.
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g npm@11 # trusted publishing needs npm >= 11.5.1 (npm 12 needs node >= 22.22)
      - run: npm ci
      - run: npm publish --access public
